<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>操作模板管理</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/static/styles.css?v=20260629-frontend-redesign" />
  <style>
    body { padding: 32px 24px; max-width: 1180px; margin: 0 auto; position: relative; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(circle at 8% 6%, var(--accent-glow) 0, transparent 32%),
        radial-gradient(circle at 96% 94%, var(--accent-glow) 0, transparent 28%);
      opacity: 0.6;
    }
    body > * { position: relative; z-index: 1; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 13px;
      padding: 6px 12px; border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    .back-link:hover { color: var(--accent); background: var(--nav-hover-bg); }

    .page-head {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 16px; flex-wrap: wrap;
      margin: 18px 0 24px; padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .page-head::after {
      content: ''; position: absolute; left: 0; bottom: -1px;
      width: 56px; height: 2px; background: var(--accent-gradient);
    }
    .page-head h1 {
      margin: 0; font-size: 28px; font-weight: 700;
      letter-spacing: 0.02em; color: var(--text);
      font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    }

    .toolbar { margin-bottom: 18px; }
    .toolbar .filters { gap: 12px; }
    .toolbar .field.compact { min-width: 240px; }

    .template-card {
      position: relative;
      background: var(--surface);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 20px 16px; margin-bottom: 14px;
      box-shadow: var(--shadow-sm); transition: var(--transition);
      overflow: hidden;
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    .template-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent-gradient); opacity: 0.55; transition: var(--transition);
    }
    .template-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent-light); }
    .template-card:hover::before { opacity: 1; width: 4px; }
    .template-card:nth-child(1) { animation-delay: 0.02s; }
    .template-card:nth-child(2) { animation-delay: 0.06s; }
    .template-card:nth-child(3) { animation-delay: 0.10s; }
    .template-card:nth-child(4) { animation-delay: 0.14s; }
    .template-card:nth-child(5) { animation-delay: 0.18s; }
    .template-card:nth-child(n+6) { animation-delay: 0.22s; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .template-card h3 {
      margin: 0 0 8px; font-size: 17px; font-weight: 700;
      color: var(--text); letter-spacing: 0.02em;
      font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    }
    .template-card .meta {
      color: var(--muted); font-size: 12.5px; margin-bottom: 10px;
      letter-spacing: 0.02em;
    }
    .template-card .meta b { color: var(--text); font-weight: 600; }
    .template-card > div { font-size: 14px; line-height: 1.7; color: var(--text); }
    .template-card .steps-preview {
      background: var(--nav-soft); border: 1px solid var(--line);
      padding: 10px 12px; border-radius: var(--radius-sm);
      font: 12px 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      max-height: 140px; overflow: auto; white-space: pre-wrap;
      color: var(--muted); line-height: 1.6;
    }
    .template-card .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

    .keyword-tag {
      display: inline-flex; align-items: center;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      padding: 3px 10px; border-radius: 999px;
      font-size: 11.5px; font-weight: 500;
      margin: 2px 4px 2px 0;
      border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
      transition: var(--transition);
    }
    .keyword-tag:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }

    .field-group {
      border: 1px solid var(--line); border-left: 3px solid var(--accent);
      border-radius: var(--radius-sm); padding: 14px 16px;
      margin: 16px 0; background: var(--nav-soft);
    }
    .field-group h4 {
      margin: 0 0 10px; font-size: 13px; font-weight: 600;
      color: var(--text); text-transform: uppercase; letter-spacing: 0.06em;
    }

    .step-list { margin: 10px 0; display: grid; gap: 8px; }
    .step-row {
      display: grid;
      grid-template-columns: 130px 1fr 1.4fr 1fr 1.4fr 38px;
      gap: 8px; align-items: stretch;
    }
    .step-row select, .step-row input {
      min-height: 38px; padding: 6px 10px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface-solid); color: var(--text);
      font-size: 12.5px; transition: var(--transition);
    }
    .step-row select:focus, .step-row input:focus {
      outline: none; border-color: var(--accent-light); box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .step-row .btn-remove { flex: 0 0 38px; min-width: 38px; padding: 0; }
    @media (max-width: 720px) {
      .step-row { grid-template-columns: 1fr 1fr; }
      .step-row .btn-remove { grid-column: span 2; }
    }

    .empty-state {
      text-align: center; padding: 64px 24px;
      color: var(--muted);
    }
    .empty-state .empty-mark {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--accent-gradient); opacity: 0.18;
      position: relative;
    }
    .empty-state .empty-mark::after {
      content: ''; position: absolute; inset: 14px;
      border: 2px dashed var(--accent); border-radius: 50%; opacity: 0.6;
    }
    .empty-state h3 {
      margin: 0 0 6px; font-size: 16px; font-weight: 600; color: var(--text);
      font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    }
    .empty-state p { margin: 0; font-size: 13px; }
    .empty { padding: 16px; text-align: center; color: var(--muted); font-size: 13px; }

    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px);
      background: var(--surface-solid); color: var(--text);
      padding: 12px 22px; border-radius: var(--radius);
      border: 1px solid var(--line); box-shadow: var(--shadow-lg);
      z-index: 9999; font-size: 14px; font-weight: 500;
      opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    .toast:not([hidden]) { opacity: 1; transform: translateX(-50%) translateY(0); }

    .modal { border-radius: var(--radius); border: 1px solid var(--line); }
    :focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; border-radius: 4px; }
  </style>
</head>
<body>
  <a href="/" class="back-link">← 返回平台</a>
  <div class="page-head">
    <h1>操作模板库</h1>
    <div>
      <button class="btn" id="newTemplateBtn">新建模板</button>
    </div>
  </div>

  <div class="toolbar" style="margin-bottom:16px">
    <div class="filters">
      <div class="field compact">
        <label>项目</label>
        <select id="projectFilter"><option value="">全部</option></select>
      </div>
    </div>
  </div>

  <div id="templateList"></div>

  <div id="toast" class="toast" hidden></div>

  <dialog id="templateModal" class="modal" style="width:700px;max-width:90vw">
    <form id="templateForm">
      <div class="modal-head">
        <h3 id="modalTitle">新建模板</h3>
        <button class="btn secondary" type="button" id="closeModal">关闭</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field"><label>模板名称 *</label><input name="name" required placeholder="如：登录操作" /></div>
          <div class="field"><label>描述</label><textarea name="description" rows="2" placeholder="描述这个模板的用途"></textarea></div>
          <div class="field"><label>所属项目 *</label><select name="project_id" required></select></div>
          <div class="field"><label>触发关键词（每行一个）</label>
            <textarea name="trigger_keywords" rows="4" placeholder="登录&#10;sign in&#10;login&#10;账号密码"></textarea>
            <div style="font-size:12px;color:var(--text-dim);margin-top:4px">匹配到这些关键词的用例会自动使用此模板</div>
          </div>
        </div>

        <div class="field-group">
          <h4>步骤编辑</h4>
          <div id="stepEditor" class="step-list"></div>
          <button class="btn secondary" type="button" id="addStepBtn">+ 添加步骤</button>
        </div>
      </div>
      <div class="modal-foot">
        <span></span>
        <button class="btn" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script>
    const API = (path, opts = {}) => {
      const token = localStorage.getItem("token") || "";
      const headers = { ...(opts.headers || {}) };
      if (token) headers["Authorization"] = "Bearer " + token;
      if (opts.body && typeof opts.body !== "string") {
        headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(opts.body);
      }
      return fetch("/api" + path, { ...opts, headers }).then(r => {
        if (r.status === 401) { localStorage.removeItem("token"); window.location.href = "/"; throw new Error("登录失效"); }
        if (!r.ok) return r.json().then(e => { throw new Error(e.detail || r.statusText); });
        if (r.status === 204) return null;
        return r.json();
      });
    };

    const STEPS_ACTIONS = ["goto","input","click","wait","wait_for_selector","text_assert","screenshot","select","check","uncheck","assert_visible","assert_url","assert_value"];

    let currentTemplateId = null;
    let projects = [];
    let allTemplates = [];

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.hidden = false;
      setTimeout(() => el.hidden = true, 2600);
    }

    async function loadProjects() {
      projects = await API("/projects");
      const sel = document.querySelector("#projectFilter");
      sel.innerHTML = '<option value="">全部</option>' + projects.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
      const modalSel = document.querySelector("#templateForm [name=project_id]");
      modalSel.innerHTML = projects.map(p => `<option value="${p.id}">${p.name}</option>`).join("");
    }

    async function loadTemplates() {
      const pid = document.querySelector("#projectFilter").value;
      const url = pid ? `/action-templates?project_id=${pid}` : "/action-templates";
      allTemplates = await API(url);
      renderTemplates();
    }

    function renderStepEditor(steps) {
      const container = document.querySelector("#stepEditor");
      if (!steps || steps.length === 0) {
        container.innerHTML = '<div class="empty" style="padding:16px">暂无步骤，点击下方按钮添加</div>';
        return;
      }
      container.innerHTML = steps.map((step, i) => {
        const actionOpts = STEPS_ACTIONS.map(a => `<option value="${a}" ${a === (step.action||'') ? 'selected' : ''}>${a}</option>`).join("");
        return `<div class="step-row">
          <select class="step-action" data-index="${i}">${actionOpts}</select>
          <input class="step-name" data-index="${i}" value="${step.name || ''}" placeholder="步骤名称" />
          <input class="step-locator" data-index="${i}" value="${step.locator || ''}" placeholder="locator" />
          <input class="step-value" data-index="${i}" value="${step.value || ''}" placeholder="value" />
          <input class="step-fallback" data-index="${i}" value="${(step.fallback_locators||[]).join(' | ')}" placeholder="fallback（| 分隔）" />
          <button class="btn secondary step-remove" data-index="${i}" type="button" style="flex:0 0 auto">×</button>
        </div>`;
      }).join("");
      container.querySelectorAll(".step-remove").forEach(btn => {
        btn.addEventListener("click", () => {
          const idx = parseInt(btn.dataset.index);
          const steps = getStepsFromEditor();
          steps.splice(idx, 1);
          renderStepEditor(steps);
        });
      });
    }

    function getStepsFromEditor() {
      const rows = document.querySelectorAll(".step-row");
      return Array.from(rows).map(row => {
        const step = {};
        const action = row.querySelector(".step-action");
        const name = row.querySelector(".step-name");
        const locator = row.querySelector(".step-locator");
        const value = row.querySelector(".step-value");
        const fallback = row.querySelector(".step-fallback");
        if (action) step.action = action.value;
        if (name && name.value) step.name = name.value;
        if (locator && locator.value) step.locator = locator.value;
        if (value && value.value) step.value = value.value;
        if (fallback && fallback.value) step.fallback_locators = fallback.value.split("|").map(s => s.trim()).filter(Boolean);
        return step;
      }).filter(s => s.action);
    }

    function renderTemplates() {
      const container = document.querySelector("#templateList");
      if (!allTemplates.length) {
        container.innerHTML = '<div class="empty-state"><div class="empty-mark"></div><h3>暂无操作模板</h3><p>点击右上角"新建模板"创建首个操作模板。</p></div>';
        return;
      }
      container.innerHTML = allTemplates.map(t => {
        const keywords = Array.isArray(t.trigger_keywords) ? t.trigger_keywords.map(k => `<span class="keyword-tag">${k}</span>`).join("") : "";
        const steps = Array.isArray(t.steps) ? t.steps.map(s => `${s.action}${s.name ? ' - ' + s.name : ''}${s.locator ? ' [' + s.locator + ']' : ''}`).join("\\n") : "";
        return `<div class="template-card">
          <h3>${t.name}</h3>
          <div class="meta">${t.description || "无描述"} · 项目 #${t.project_id} · 创建于 ${t.create_time || ""}</div>
          <div>${keywords}</div>
          <div class="steps-preview">${steps || "无步骤"}</div>
          <div class="actions">
            <button class="btn secondary" onclick="editTemplate(${t.id})">编辑</button>
            <button class="btn secondary" onclick="testTemplate(${t.id})">测试运行</button>
            <button class="btn secondary" onclick="deleteTemplate(${t.id})">删除</button>
          </div>
        </div>`;
      }).join("");
    }

    function openModal(title, template) {
      currentTemplateId = template?.id || null;
      document.querySelector("#modalTitle").textContent = title;
      const form = document.querySelector("#templateForm");
      form.querySelector("[name=name]").value = template?.name || "";
      form.querySelector("[name=description]").value = template?.description || "";
      form.querySelector("[name=project_id]").value = template?.project_id || projects[0]?.id || "";
      const kws = Array.isArray(template?.trigger_keywords) ? template.trigger_keywords.join("\\n") : "";
      form.querySelector("[name=trigger_keywords]").value = kws;
      renderStepEditor(template?.steps || []);
      document.querySelector("#templateModal").showModal();
    }

    async function editTemplate(id) {
      const t = allTemplates.find(x => x.id === id);
      if (t) openModal("编辑模板", t);
    }

    async function testTemplate(id) {
      try {
        const result = await API(`/action-templates/${id}/test-run`);
        showToast(result.passed ? "测试执行通过" : "测试执行失败，请查看详情");
        console.log("Test result:", result);
      } catch (e) {
        showToast("测试失败: " + e.message);
      }
    }

    async function deleteTemplate(id) {
      if (!confirm("确定删除此模板？")) return;
      await API(`/action-templates/${id}`, { method: "DELETE" });
      showToast("已删除");
      await loadTemplates();
    }

    // Event handlers
    document.querySelector("#newTemplateBtn").addEventListener("click", () => openModal("新建模板", null));
    document.querySelector("#closeModal").addEventListener("click", () => document.querySelector("#templateModal").close());
    document.querySelector("#projectFilter").addEventListener("change", loadTemplates);

    document.querySelector("#addStepBtn").addEventListener("click", () => {
      const steps = getStepsFromEditor();
      steps.push({ action: "click", name: "", locator: "", value: "", fallback_locators: [] });
      renderStepEditor(steps);
    });

    document.querySelector("#templateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const triggerRaw = (form.get("trigger_keywords") || "").split("\\n").map(s => s.trim()).filter(Boolean);
      const data = {
        project_id: parseInt(form.get("project_id")),
        name: form.get("name"),
        description: form.get("description") || "",
        trigger_keywords: triggerRaw,
        steps: getStepsFromEditor(),
        variables: {},
        locator_fallbacks: {},
      };
      try {
        if (currentTemplateId) {
          await API(`/action-templates/${currentTemplateId}`, { method: "PUT", body: data });
          showToast("模板已更新");
        } else {
          await API("/action-templates", { method: "POST", body: data });
          showToast("模板已创建");
        }
        document.querySelector("#templateModal").close();
        await loadTemplates();
      } catch (e) {
        showToast("保存失败: " + e.message);
      }
    });

    // Init
    (async () => {
      const token = localStorage.getItem("token");
      if (!token) { document.body.innerHTML = '<p style="padding:40px;text-align:center">请先登录平台</p>'; return; }
      await loadProjects();
      await loadTemplates();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>定位器自愈记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/static/styles.css?v=20260812-v3-grok-1" />
  <link rel="stylesheet" href="/static/design-tokens.css?v=20260812-v3-grok-1" />
  <link rel="stylesheet" href="/static/design-system-base.css?v=20260812-v3-grok-1" />
  <script src="/static/v2-theme-lock.js?v=20260728-phase1"></script>
  <style>
    body { padding: 32px 24px; max-width: 1180px; margin: 0 auto; position: relative; }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(circle at 8% 6%, var(--accent-glow) 0, transparent 32%),
        radial-gradient(circle at 96% 94%, var(--accent-glow) 0, transparent 28%);
      opacity: 0.6;
    }
    body > * { position: relative; z-index: 1; }

    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--muted); text-decoration: none; font-size: 13px;
      padding: 6px 12px; border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    .back-link:hover { color: var(--accent); background: var(--nav-hover-bg); }

    .page-head {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 16px; flex-wrap: wrap;
      margin: 18px 0 28px; padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .page-head::after {
      content: ''; position: absolute; left: 0; bottom: -1px;
      width: 56px; height: 2px; background: var(--accent-gradient);
    }
    .page-head h1 {
      margin: 0; font-size: 28px; font-weight: 700;
      letter-spacing: 0.02em; color: var(--text);
      font-family: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
    }
    .page-head .filter-bar { display: flex; gap: 8px; align-items: center; }
    .page-head input {
      min-height: 38px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface-solid); color: var(--text);
      transition: var(--transition);
    }
    .page-head input:focus { outline: none; border-color: var(--accent-light); box-shadow: 0 0 0 3px var(--accent-glow); }

    .heal-card {
      position: relative;
      background: var(--surface);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: var(--radius);
      padding: 18px 20px 16px; margin-bottom: 14px;
      box-shadow: var(--shadow-sm); transition: var(--transition);
      overflow: hidden;
      animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }
    .heal-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent-gradient); opacity: 0.55; transition: var(--transition);
    }
    .heal-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: var(--accent-light); }
    .heal-card:hover::before { opacity: 1; width: 4px; }
    .heal-card:nth-child(1) { animation-delay: 0.02s; }
    .heal-card:nth-child(2) { animation-delay: 0.06s; }
    .heal-card:nth-child(3) { animation-delay: 0.10s; }
    .heal-card:nth-child(4) { animation-delay: 0.14s; }
    .heal-card:nth-child(5) { animation-delay: 0.18s; }
    .heal-card:nth-child(6) { animation-delay: 0.22s; }
    .heal-card:nth-child(n+7) { animation-delay: 0.26s; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .heal-card .meta {
      color: var(--muted); font-size: 12.5px; margin-bottom: 10px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
      letter-spacing: 0.02em;
    }
    .heal-card .meta b { color: var(--text); font-weight: 600; }
    .heal-card > div { font-size: 14px; line-height: 1.7; color: var(--text); }
    .heal-card .old {
      color: var(--danger); text-decoration: line-through; text-decoration-color: var(--danger-light);
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 12.5px;
      word-break: break-all;
    }
    .heal-card .new {
      color: var(--success); font-weight: 500;
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 12.5px;
      word-break: break-all;
    }
    .heal-card a { color: var(--accent); text-decoration: none; word-break: break-all; }
    .heal-card a:hover { text-decoration: underline; }
    .heal-card .actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

    .heal-card .detail {
      margin-top: 12px; padding: 12px 14px;
      background: var(--nav-soft); border: 1px solid var(--line);
      border-radius: var(--radius-sm); font-size: 12.5px;
      color: var(--text);
    }
    .heal-card .detail pre {
      white-space: pre-wrap; word-break: break-all; margin: 6px 0;
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; font-size: 12px;
      color: var(--muted); line-height: 1.6;
    }
    .heal-card .detail b { color: var(--text); }
    .heal-card .screenshot {
      max-width: 400px; max-height: 220px; margin-top: 10px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      cursor: pointer; transition: var(--transition);
    }
    .heal-card .screenshot:hover { transform: scale(1.01); border-color: var(--accent-light); box-shadow: var(--shadow-sm); }

    .toggle-detail {
      display: inline-flex; align-items: center; gap: 4px;
      cursor: pointer; color: var(--accent); font-size: 12px;
      padding: 4px 0; transition: var(--transition); user-select: none;
    }
    .toggle-detail:hover { color: var(--accent-dark); }
    .toggle-detail::before { content: '▸'; transition: transform 0.2s ease; display: inline-block; }
    .toggle-detail.open::before { transform: rotate(90deg); }

    .badge {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
      border: 1px solid transparent;
    }
    .badge.ok { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--success); border-color: color-mix(in srgb, var(--success) 26%, transparent); }
    .badge.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 28%, transparent); }
    .badge.fail { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 26%, transparent); }
    .badge.ai {
      background: var(--accent-gradient); color: #fff;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .empty-state {
      text-align: center; padding: 64px 24px;
      color: var(--muted);
    }
    .empty-state .empty-mark {
      width: 56px; height: 56px; margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--accent-gradient); opacity: 0.18;
      position: relative;
    }
    .empty-state .empty-mark::after {
      content: ''; position: absolute; inset: 14px;
      border: 2px dashed var(--accent); border-radius: 50%; opacity: 0.6;
    }
    .empty-state h3 {
      margin: 0 0 6px; font-size: 16px; font-weight: 600; color: var(--text);
      font-family: 'Noto Serif SC', 'Source Han Serif SC', serif;
    }
    .empty-state p { margin: 0; font-size: 13px; }

    .pagination {
      display: flex; gap: 6px; justify-content: center; align-items: center;
      margin-top: 28px; padding: 16px 0;
    }
    .pagination button {
      min-height: 34px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--surface-solid); color: var(--text);
      cursor: pointer; transition: var(--transition); font-size: 13px;
    }
    .pagination button:hover { border-color: var(--accent-light); color: var(--accent); box-shadow: var(--shadow-sm); }
    .pagination span { color: var(--muted); font-size: 13px; padding: 0 8px; }

    .toast {
      position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-12px);
      background: var(--surface-solid); color: var(--text);
      padding: 12px 22px; border-radius: var(--radius);
      border: 1px solid var(--line); box-shadow: var(--shadow-lg);
      z-index: 9999; font-size: 14px; font-weight: 500;
      opacity: 0; transition: opacity 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }
    .toast:not([hidden]) { opacity: 1; transform: translateX(-50%) translateY(0); }

    :focus-visible { outline: 2px solid var(--accent-light); outline-offset: 2px; border-radius: 4px; }

    /* v3-enterprise-admin-utilities */
    /* Frontend V3 Enterprise AI Workbench: visual-only overrides. */
    body {
      max-width: none; min-height: 100vh; margin: 0; padding: 24px;
      background: #f4f6f8; color: var(--text, #29343d);
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body::before { background: none; }
    .back-link, .page-head, #healList, .pagination {
      width: min(100%, 1440px); margin-left: auto; margin-right: auto;
    }
    .back-link {
      padding: 7px 10px; border-radius: 7px; color: #7987a1;
    }
    .back-link:hover { color: #5d87ff; background: #edf2ff; }
    .page-head {
      align-items: center; margin-top: 12px; margin-bottom: 10px; padding: 12px 16px;
      background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.06); border-radius: 8px;
      box-shadow: none;
    }
    .page-head::after { left: 0; top: 12px; bottom: 12px; width: 3px; height: auto; background: #5d87ff; border-radius: 2px; }
    .page-head h1, .empty-state h3 {
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page-head h1 { font-size: 18px; font-weight: 600; letter-spacing: 0; color: #323251; }
    .page-head .filter-bar { gap: 8px; }
    .page-head input {
      min-height: 36px; height: 36px; padding: 0 12px;
      border: 1px solid #dbdfe1; border-radius: 7px; background: #ffffff; font-size: 13px;
    }
    .page-head input:focus {
      outline: none; border-color: #5d87ff; box-shadow: 0 0 0 3px rgba(93, 135, 255, 0.18);
    }
    .btn {
      min-height: 36px; height: 36px; padding: 0 14px; border-radius: 7px;
      font-size: 13px; font-weight: 600; box-shadow: none;
    }
    .btn.secondary { border: 1px solid #dbdfe1; background: #ffffff; color: #4d5875; }
    .btn.secondary:hover { background: #f2f4f5; border-color: #cfd6dc; }
    .heal-card {
      padding: 12px 14px 10px; margin-bottom: 10px;
      background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.06); border-radius: 8px;
      -webkit-backdrop-filter: none; backdrop-filter: none;
      box-shadow: none; animation: none;
    }
    .heal-card::before { background: #5d87ff; opacity: 1; width: 3px; }
    .heal-card:hover { transform: none; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06); border-color: rgba(15, 23, 42, 0.08); }
    .heal-card > div { line-height: 1.55; font-size: 13px; }
    .heal-card .detail {
      background: #f4f6f8; border: 1px solid rgba(15, 23, 42, 0.06); border-radius: 7px;
    }
    .heal-card .screenshot {
      border: 1px solid rgba(15, 23, 42, 0.06); border-radius: 7px;
    }
    .heal-card .screenshot:hover { transform: none; box-shadow: none; border-color: #5d87ff; }
    .badge {
      min-height: 22px; border-radius: 6px; font-size: 11px; letter-spacing: 0;
    }
    .badge.ai { background: #5d87ff; box-shadow: none; }
    .toggle-detail { color: #5d87ff; font-size: 12px; }
    .empty-state {
      min-height: 240px; padding: 56px 24px;
      background: #ffffff; border: 1px solid rgba(15, 23, 42, 0.06); border-radius: 8px;
    }
    .empty-state .empty-mark { background: #edf2ff; opacity: 1; }
    .pagination {
      margin-top: 10px; padding: 10px 0; gap: 8px;
    }
    .pagination button {
      min-height: 36px; padding: 0 14px; border: 1px solid #dbdfe1; border-radius: 7px;
      background: #ffffff; color: #4d5875; font-size: 13px; box-shadow: none;
    }
    .pagination button:hover {
      border-color: #5d87ff; color: #5d87ff; background: #edf2ff; box-shadow: none;
    }
    .toast {
      top: auto; bottom: 24px; left: auto; right: 24px;
      transform: translateY(8px);
      border-radius: 8px; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
    }
    .toast:not([hidden]) { transform: translateY(0); }
  </style>
</head>
<body>
  <a href="/" class="back-link">← 返回平台</a>
  <div class="page-head">
    <h1>定位器自愈记录</h1>
    <div class="filter-bar">
      <input id="caseIdFilter" type="number" placeholder="按用例ID筛选" style="width:160px" />
      <button class="btn" onclick="loadLogs(1)">查询</button>
    </div>
  </div>

  <div id="healList"></div>
  <div id="pagination" class="pagination"></div>
  <div id="toast" class="toast" hidden></div>

  <script>
    const API = (path, opts = {}) => {
      const token = localStorage.getItem("token") || "";
      const headers = { ...(opts.headers || {}) };
      if (token) headers["Authorization"] = "Bearer " + token;
      if (opts.body && typeof opts.body !== "string") {
        headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(opts.body);
      }
      return fetch("/api" + path, { ...opts, headers }).then(r => {
        if (r.status === 401) { localStorage.removeItem("token"); window.location.href = "/"; throw new Error("登录失效"); }
        if (!r.ok) return r.json().then(e => { throw new Error(e.detail || r.statusText); });
        return r.json();
      });
    };

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.hidden = false;
      setTimeout(() => el.hidden = true, 2600);
    }

    function escapeHtml(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function screenshotUrl(path) {
      if (!path) return "";
      // 文件系统路径转为 /reports/screenshots/xxx.png
      const idx = path.replace(/\\\\/g, "/").lastIndexOf("reports/");
      if (idx >= 0) return "/" + path.substr(idx).replace(/\\\\/g, "/");
      return path;
    }

    let currentPage = 1;
    let totalPages = 1;

    async function loadLogs(page) {
      currentPage = page || 1;
      const caseId = document.getElementById("caseIdFilter").value;
      let path = `/locator-heal-logs?page=${currentPage}&page_size=20`;
      if (caseId) path += `&case_id=${caseId}`;
      const data = await API(path);
      const logs = data.items || [];
      totalPages = Math.ceil((data.total || 0) / (data.page_size || 20));
      const container = document.getElementById("healList");
      if (!logs.length) {
        container.innerHTML = '<div class="empty-state"><div class="empty-mark"></div><h3>暂无自愈记录</h3><p>定位器失败后将自动记录于此，AI 推理成功即生成条目。</p></div>';
        document.getElementById("pagination").innerHTML = "";
        return;
      }
      container.innerHTML = logs.map(log => {
        const statusBadge = log.auto_applied
          ? '<span class="badge ok">已自动应用</span>'
          : log.confirmed
            ? '<span class="badge ok">已确认</span>'
            : log.new_locator
              ? '<span class="badge warn">待确认</span>'
              : '<span class="badge fail">验证失败</span>';
        const aiBadge = log.ai_response ? '<span class="badge ai">AI</span>' : '';
        const hasDetail = log.ai_prompt || log.ai_response || log.screenshot_path;
        const detailHtml = hasDetail ? `
          <div class="toggle-detail" onclick="const d=this.nextElementSibling; const open=d.style.display!=='none'; d.style.display=open?'none':'block'; this.classList.toggle('open', !open);">${log.ai_response ? '展开 AI 推理详情' : '展开详情'}</div>
          <div class="detail" style="display:none">
            ${log.step_action ? `<div>步骤动作: <b>${escapeHtml(log.step_action)}</b></div>` : ""}
            ${log.ai_response ? `<div>AI 返回: <pre>${escapeHtml(log.ai_response)}</pre></div>` : ""}
            ${log.ai_prompt ? `<div>Prompt: <pre>${escapeHtml(log.ai_prompt).slice(0,500)}...</pre></div>` : ""}
            ${log.screenshot_path ? `<img class="screenshot" src="${screenshotUrl(log.screenshot_path)}" onclick="window.open(this.src)" />` : ""}
          </div>` : "";
        const actions = log.new_locator && !log.auto_applied
          ? `<button class="btn secondary" onclick="applyLog(${log.id})">确认应用</button>
             <button class="btn secondary" onclick="confirmLog(${log.id}, 0)">驳回</button>`
          : log.confirmed
            ? `<button class="btn secondary" onclick="confirmLog(${log.id}, 0)">撤销确认</button>`
            : "";
        return `
          <div class="heal-card">
            <div class="meta">
              用例 #${log.case_id} · ${new Date(log.create_time).toLocaleString()}
              ${statusBadge}${aiBadge}
            </div>
            <div>旧定位器：<span class="old">${escapeHtml(log.old_locator)}</span></div>
            ${log.new_locator ? `<div>新定位器：<span class="new">${escapeHtml(log.new_locator)}</span></div>` : ""}
            ${log.page_url ? `<div>页面：<a href="${escapeHtml(log.page_url)}" target="_blank">${escapeHtml(log.page_url)}</a></div>` : ""}
            ${detailHtml}
            <div class="actions">${actions}</div>
          </div>
        `;
      }).join("");
      renderPagination();
    }

    function renderPagination() {
      const el = document.getElementById("pagination");
      if (totalPages <= 1) { el.innerHTML = ""; return; }
      let html = "";
      if (currentPage > 1) html += `<button onclick="loadLogs(${currentPage - 1})">上一页</button>`;
      html += `<span style="padding:6px 12px">第 ${currentPage} / ${totalPages} 页</span>`;
      if (currentPage < totalPages) html += `<button onclick="loadLogs(${currentPage + 1})">下一页</button>`;
      el.innerHTML = html;
    }

    async function confirmLog(id, confirmed) {
      await API(`/locator-heal-logs/${id}`, { method: "PUT", body: { confirmed } });
      showToast(confirmed ? "已确认" : "已驳回");
      loadLogs(currentPage);
    }

    async function applyLog(id) {
      const res = await API(`/locator-heal-logs/${id}/apply`, { method: "POST" });
      showToast(res.message || "操作完成");
      loadLogs(currentPage);
    }

    const token = localStorage.getItem("token");
    if (!token) {
      document.body.innerHTML = '<p style="padding:40px;text-align:center">请先登录平台</p>';
    } else {
      loadLogs(1);
    }
  </script>
</body>
</html>
